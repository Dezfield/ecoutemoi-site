name: Verify web app
on:
  push:
    paths:
      - 'app/**'
      - 'src/tokens.css'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'src/tokens.css'
      - '.github/workflows/app.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Builds without Supabase settings: the bundle must compile and degrade gracefully.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Browser checks against a mocked Supabase backend; no secrets are used.
      - run: npm run test:e2e
